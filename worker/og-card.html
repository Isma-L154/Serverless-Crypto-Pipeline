<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Link preview card &middot; source</title>

    <!--
      Source for public/og.png, the image social platforms show when the
      dashboard's URL is shared.

      It is a source file, not an asset: it lives outside public/ so Workers
      Assets never serves it. Only the rendered PNG ships.

      Platforms do not agree on SVG support and several ignore it outright, so
      the shared image has to be a raster one. To regenerate after editing,
      open this file in a browser sized to exactly 1200x630 and screenshot it:

        npx playwright screenshot --viewport-size=1200,630 og-card.html public/og.png

      The fonts and colours are the dashboard's own, loaded from the same files
      the site serves, so the card cannot drift from the page it advertises.
    -->
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 400 600;
        src: url("public/fonts/inter-variable.woff2") format("woff2");
      }

      @font-face {
        font-family: "JetBrains Mono";
        font-style: normal;
        font-weight: 400 700;
        src: url("public/fonts/jetbrains-mono-variable.woff2") format("woff2");
      }

      :root {
        --bg: #0a0e14;
        --border: #1e2a38;
        --text: #e6edf3;
        --muted: #8b98a9;
        --accent: #f59e0b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* The accent hairline the dashboard uses along the top of its panels. */
      .rule {
        height: 5px;
        background: linear-gradient(90deg, #f59e0b, rgb(245 158 11 / 0));
      }

      .card {
        height: 625px;
        padding: 56px 72px 48px;
        display: flex;
        flex-direction: column;
      }

      h1 {
        margin: 0;
        font-size: 60px;
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1.05;
      }

      h1 .mark {
        color: var(--accent);
      }

      p.lede {
        margin: 22px 0 0;
        max-width: 900px;
        font-size: 25px;
        line-height: 1.45;
        color: var(--muted);
      }

      .chart {
        margin-top: auto;
        display: block;
      }

      footer {
        margin-top: 30px;
        padding-top: 24px;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 21px;
      }

      .coins {
        display: flex;
        gap: 26px;
        color: var(--muted);
      }

      .coin {
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .swatch {
        width: 11px;
        height: 11px;
        border-radius: 50%;
      }

      .btc {
        background: #f7931a;
      }
      .eth {
        background: #8fa2f5;
      }
      .sol {
        background: #14f195;
      }
      .bnb {
        background: #f3ba2f;
      }
      .ada {
        background: #4c8dff;
      }

      .domain {
        color: var(--accent);
        font-weight: 700;
      }
    </style>
  </head>
