version: 2

updates:
  # Cloudflare Worker dependencies
  - package-ecosystem: npm
    directory: /worker
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      worker-dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # Terraform providers and modules
  - package-ecosystem: terraform
    directory: /terraform
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # GitHub Actions, pinned by SHA and updated here rather than by moving tags
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # init and analyze must run the same release, or analyze rejects the
      # configuration init wrote.
      codeql-action:
        patterns:
          - github/codeql-action*

  # Archiver Lambda dependencies
  - package-ecosystem: pip
    directory: /terraform/lambda/archiver
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
